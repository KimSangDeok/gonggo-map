name: notify-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q pywebpush
      - run: python tools/notify_new.py --test
        env:
          PUSH_SEED: ${{ secrets.PUSH_SEED }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
