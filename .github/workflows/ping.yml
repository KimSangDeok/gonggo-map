name: ping-sources
on:
  push:
    paths: ['.github/workflows/ping.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe sources
        run: |
          mkdir -p data
          probe() { code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 25 -A 'Mozilla/5.0 (X11; Linux x86_64)' "$1" || echo ERR); printf '"%s": {"code": "%s", "bytes": %s, "kr": %s}' "$2" "$code" "$(wc -c </tmp/body)" "$(grep -c -m1 -E '공고|단지|주택' /tmp/body || true)"; }
          {
            echo '{'
            probe 'https://www.i-sh.co.kr/app/lay2/program/S1T294C295/www/brd/m_241/list.do' sh_board; echo ','
            probe 'https://www.i-sh.co.kr/houseinfo/main/mainPage.do' sh_houseinfo; echo ','
            probe 'https://www.k-apt.go.kr/web/main/index.do' kapt_main; echo ','
            probe 'https://apply.lh.or.kr/lhapply/apply/wt/wrtanc/selectWrtancList.do?mi=1026' lh_list; echo ','
            probe 'https://apply.gh.or.kr/' gh_main; echo ','
            printf '"at": "%s", "runner_ip_country": "%s"\n' "$(date -u +%FT%TZ)" "$(curl -s --max-time 10 https://ipinfo.io/country || echo '?')"
            echo '}'
          } > data/ping.json
          cat data/ping.json
      - name: commit result
        run: |
          git config user.name 'gonggo-bot'
          git config user.email 'gonggo-bot@users.noreply.github.com'
          git add data/ping.json
          git commit -m 'probe: can GitHub runner reach SH/K-apt/LH/GH?' || exit 0
          git push
