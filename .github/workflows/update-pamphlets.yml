name: update-pamphlets
on:
  schedule:
    - cron: '37 2 2 * *'       # 매월 2일 11:37 KST
  workflow_dispatch:
  push:
    paths: ['tools/update_pamphlets.py', '.github/workflows/update-pamphlets.yml']
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests beautifulsoup4 pdfplumber pillow
      - run: python tools/update_pamphlets.py
      - name: commit
        run: |
          git config user.name 'gonggo-bot'; git config user.email 'gonggo-bot@users.noreply.github.com'
          git add data/pamphlets.json data/pamphlets
          git diff --cached --quiet && { echo 'no change'; exit 0; }
          git commit -m "data: 전자팸플릿 갱신 $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs origin gh-pages && git push && exit 0; git rebase --abort 2>/dev/null; sleep 15; done
          exit 1
